# Builds both sites and deploys each dist/ to its demo folder on the cPanel server
# on every push to main.
#
# Required secrets (organization secrets, shared with the other franklinslist demos):
#   FTP_HOST       server hostname or IP
#   FTP_USERNAME   deploy FTP account scoped to the franklinslist document root
#   FTP_PASSWORD   that account's password
#
# The action keeps a .ftp-deploy-sync-state.json file in each server folder to
# upload only changed files on later deploys — leave them in place.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Deploy rental boats over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: rentalboats/dist/
          server-dir: ./demo-boat.franklinslist.com/

      - name: Deploy parasailing over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: parasailing/dist/
          server-dir: ./demo-para.franklinslist.com/
